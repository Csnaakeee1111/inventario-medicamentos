# Arma InventarioMedicamentos.exe para Windows y lo publica como Release.
# Se dispara al subir una etiqueta:  git tag v1.0.1 && git push --tags
name: Armar .exe de Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0

      - name: Poner versión y repositorio
        shell: python
        run: |
          import os, re, pathlib
          ref = os.environ["GITHUB_REF_NAME"]
          version = ref.lstrip("vV") if ref[:1] in "vV" else "0.0.0-dev"
          p = pathlib.Path("inventario/version.py")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'^VERSION = ".*"', f'VERSION = "{version}"', s, flags=re.M)
          s = re.sub(r'^REPO_GITHUB = ".*"', f'REPO_GITHUB = "{os.environ["GITHUB_REPOSITORY"]}"', s, flags=re.M)
          p.write_text(s, encoding="utf-8")
          print(s)

      - name: Pruebas (movimientos y pantallas)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python pruebas/prueba_movimientos.py
          python pruebas/prueba_pantallas.py
          python pruebas/prueba_excel.py

      - name: Armar .exe
        run: pyinstaller --noconfirm --onefile --windowed --name InventarioMedicamentos main.py

      - uses: actions/upload-artifact@v4
        with:
          name: InventarioMedicamentos
          path: dist/InventarioMedicamentos.exe

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InventarioMedicamentos.exe
          generate_release_notes: true
